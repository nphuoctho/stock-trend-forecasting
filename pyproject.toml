[project]
name = "stock-trend-forecasting"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "nphuoctho", email = "phuoctho.dev@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.14.0",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
    "sentencepiece>=0.2.2",
    "torch>=2.13.0",
    "transformers>=5.15.1",
    "vnstock>=4.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stf"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
